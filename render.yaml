services:
  - type: web
    name: mediabot-controller
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MEDIA_ENGINE_URL
        sync: false
      - key: CALL_ENGINE_SECRET
        sync: false
      - key: OWNER_ID
        sync: false
      - key: WEBHOOK_PATH
        value: telegram
